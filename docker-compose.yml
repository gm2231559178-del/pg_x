services:
  postgres:
    image: postgres:16-alpine
    container_name: pgx_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: pgx_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: pgx_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Periodic Elasticsearch index refresh — rebuilds an index from a SQL query.
  # Opt-in: start with `docker compose --profile refresh up` or
  #         `docker compose up index-refresh`.
  # Tune the query/index/interval via the REFRESH_* env vars (or a .env file).
  index-refresh:
    build: .
    container_name: pgx_index_refresh
    profiles: ["refresh"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      ES_URL: http://elasticsearch:9200
      REFRESH_QUERY: ${REFRESH_QUERY:-SELECT mat_no, name, status FROM materials}
      REFRESH_INDEX: ${REFRESH_INDEX:-materials}
      REFRESH_ID_FIELD: ${REFRESH_ID_FIELD:-mat_no}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-30}
    volumes:
      - ./scripts/index-refresh.sh:/scripts/index-refresh.sh:ro
    entrypoint: ["/bin/sh", "/scripts/index-refresh.sh"]

  redis:
    image: redis:7-alpine
    container_name: pgx_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  memcached:
    image: memcached:1-alpine
    container_name: pgx_memcached
    ports:
      - "11211:11211"

volumes:
  pgdata:
  esdata:
